name: smart_ledger
description: "Smart Ledger financial management app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.2

  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  fl_chart: ^0.70.0
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  url_launcher: ^6.2.5
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
